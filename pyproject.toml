[project]
name = "fast-user"
version = "0.0.1"

requires-python = ">=3.12"

dependencies = [
    "ruff>=0.14.10",
    "black>=25.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.36",
    "pydantic[email]>=2.11.7,<3",
    "pydantic-settings>=2.10.1,<3",
    "sqlalchemy[asyncio]>=2.0.42,<3",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.16.4,<2",
    "fastapi-users[sqlalchemy]>=14.0.1,<15",
    "gunicorn>=23.0.0,<24",
    "aiohttp>=3.12.15,<4",
    "orjson>=3.11.1,<4",
    "jinja2>=3.1.6,<4",
    "aiosmtplib>=4.0.1,<5",
    "sqladmin[full]>=0.21.0,<0.22",
    "fastapi-cache2>=0.2.2,<0.3",
    "redis>=6.4.0,<7",
]

[tool.uv]
package = false



[tool.ruff.lint]
ignore = [
    "F401",
    "E402",
    "F541"
]

[tool.ruff]
line-length = 120
indent-width = 4
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    ".vscode",
    "__pypackages__",
    "__pycache__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "site-packages"
]




[tool.black]
line-length = 120
exclude = '''
/(
  # directories
  \.venv
  | venv
  | \.git
  | \.log
  | \.mypy_cache
  | \.tox
  | build
  | dist
)/
'''
